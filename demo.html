<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghar Ledger — Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#6C4CE0; --teal:#00BFA6; --pink:#FF6FA5; --gold:#FFB020;
    --ink:#241F3A; --ink-soft:#7A7594; --line:#E7E3FA;
    --paper:#FFFFFF; --paper-raised:#FBFAFF;
    --red:#FF5A5F; --green:#12B76A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,111,165,0.30), transparent 40%),
      radial-gradient(circle at 88% 12%, rgba(0,191,166,0.28), transparent 42%),
      radial-gradient(circle at 50% 95%, rgba(255,176,32,0.22), transparent 45%),
      linear-gradient(160deg, #FFF6E9, #EFF3FF 60%, #EAFBF6);
    background-attachment:fixed;
    color:var(--ink);
    min-height:100%;
    display:flex; justify-content:center;
    padding:max(16px, env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom));
  }
  html[dir="rtl"] body{ direction:rtl; }
  html[lang="ur"] body, html[lang="ur"] input{ font-family:'Noto Nastaliq Urdu', serif; }

  #app{ width:100%; max-width:460px; display:flex; flex-direction:column; height:calc(100vh - 32px); }

  .header{
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(135deg, var(--purple), var(--teal));
    border-radius:20px; padding:16px 16px; color:#fff;
    box-shadow:0 10px 24px rgba(108,76,224,0.3), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .agent-avatar{
    width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.22);
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
    transition: transform .2s;
  }
  .agent-avatar.speaking{ animation: avatarPulse 0.9s infinite; }
  @keyframes avatarPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
  .agent-info{ flex:1; min-width:0; }
  .agent-name{ font-weight:800; font-size:15px; }
  .agent-status{ font-size:11.5px; color:rgba(255,255,255,0.85); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #langToggle{
    background:rgba(255,255,255,0.2); border:none; color:#fff; font-weight:800;
    padding:9px 14px; border-radius:20px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  #langToggle:active{ transform:scale(0.95); }

  .chat{
    flex:1; overflow-y:auto; padding:16px 2px; display:flex; flex-direction:column; gap:10px;
  }
  .msg{ max-width:84%; padding:12px 15px; border-radius:16px; font-size:14px; line-height:1.55; white-space:pre-line; }
  .msg.agent{
    align-self:flex-start; background:var(--paper); border:2px solid var(--line);
    border-bottom-left-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.05);
  }
  html[dir="rtl"] .msg.agent{ border-bottom-left-radius:16px; border-bottom-right-radius:4px; }
  .msg.user{
    align-self:flex-end; background:linear-gradient(135deg, var(--purple), var(--teal)); color:#fff;
    border-bottom-right-radius:4px; font-weight:600;
  }
  html[dir="rtl"] .msg.user{ border-bottom-right-radius:16px; border-bottom-left-radius:4px; }

  .chips{ display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; -webkit-overflow-scrolling:touch; }
  .chip{
    flex-shrink:0; white-space:nowrap; background:var(--paper-raised); border:2px solid var(--line);
    color:var(--purple); font-weight:800; font-size:12.5px; padding:10px 15px; border-radius:20px;
    cursor:pointer; font-family:inherit;
  }
  .chip:active{ transform:scale(0.96); }

  .input-row{ display:flex; gap:8px; padding-top:2px; }
  #micBtn{
    flex-shrink:0; width:50px; height:50px; border-radius:50%; border:2px solid var(--teal);
    background:rgba(0,191,166,0.12); color:var(--purple); font-size:19px; cursor:pointer;
  }
  #micBtn.listening{ background:var(--red); color:#fff; border-color:var(--red); animation:avatarPulse 0.9s infinite; }
  #textInput{
    flex:1; padding:0 16px; border-radius:25px; border:2px solid var(--line); font-size:14.5px;
    background:var(--paper-raised); color:var(--ink); font-family:inherit;
  }
  #sendBtn{
    flex-shrink:0; width:50px; height:50px; border-radius:50%; border:none;
    background:linear-gradient(135deg, var(--purple), var(--teal)); color:#fff; font-size:18px; cursor:pointer;
    box-shadow:0 6px 16px rgba(108,76,224,0.35);
  }
  #sendBtn:active, #micBtn:active{ transform:scale(0.95); }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="agent-avatar" id="avatar">🏠</div>
    <div class="agent-info">
      <div class="agent-name" id="agentName">Ghar Ledger Assistant</div>
      <div class="agent-status" id="statusText">Tap a question or type below</div>
    </div>
    <button id="langToggle">اردو</button>
  </div>

  <div class="chat" id="chatWindow"></div>

  <div class="chips" id="chipRow"></div>

  <div class="input-row">
    <button id="micBtn">🎤</button>
    <input id="textInput" type="text" placeholder="Ask a question…">
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
/* ============== Content: edit prices/contact here ============== */
const CONTACT_PHONE = "0336-9810595"; // TODO: confirm/replace with the number you want for Ghar Ledger license queries

const TOPICS = [
  {
    id: 'intro',
    keywords: { en: ['what is', 'about', 'ghar ledger', 'introduce'], ur: ['کیا ہے', 'تعارف', 'گھر لیجر'] },
    chip: { en: '👋 What is this?', ur: '👋 یہ کیا ہے؟' },
    text: {
      en: "Ghar Ledger is a simple household accounting app. Track your income and expenses, set a monthly budget for each category, and see exactly where your money goes — all fully offline and private, right on your own phone.",
      ur: "گھر لیجر ایک آسان گھریلو حساب کتاب والی ایپ ہے۔ اپنی آمدنی اور خرچ کا ریکارڈ رکھیں، ہر قسم کے لیے ماہانہ بجٹ مقرر کریں، اور دیکھیں کہ آپ کے پیسے کہاں خرچ ہو رہے ہیں — مکمل طور پر آف لائن اور آپ کے اپنے فون پر محفوظ۔"
    }
  },
  {
    id: 'demo',
    keywords: { en: ['demo', 'show me', 'features', 'how does it work'], ur: ['ڈیمو', 'دکھاؤ', 'خصوصیات', 'کیسے کام کرتا ہے'] },
    chip: { en: '📊 Show me a demo', ur: '📊 ڈیمو دکھائیں' },
    text: {
      en: "Here's what Ghar Ledger can do:\n\n💰 Add income or expenses in seconds, with optional item lists like a grocery breakdown.\n🎤 Speak an entry out loud — it fills in the amount and category by itself.\n📈 Set a monthly budget per category, with a warning when you're close to going over.\n🍩 See a colorful chart of where your money goes, plus a monthly comparison to last month.\n🔁 Recurring entries like rent or salary add themselves automatically every month.\n🌐 Works in 8 languages including English, Urdu, Pashto, and Hindko.\n📴 Fully offline — your data never leaves your phone.",
      ur: "گھر لیجر یہ سب کچھ کر سکتا ہے:\n\n💰 چند سیکنڈ میں آمدنی یا خرچ شامل کریں، اشیاء کی تفصیلی لسٹ کے ساتھ بھی۔\n🎤 بس بول کر انٹری شامل کریں — رقم اور قسم خود بخود بھر جاتی ہے۔\n📈 ہر قسم کے لیے ماہانہ بجٹ مقرر کریں، بجٹ کے قریب پہنچنے پر خبردار کرے گا۔\n🍩 اپنے خرچ کا رنگین چارٹ دیکھیں، اور پچھلے مہینے سے موازنہ بھی۔\n🔁 کرایہ یا تنخواہ جیسی انٹریاں ہر مہینے خود بخود شامل ہو جاتی ہیں۔\n🌐 انگریزی، اردو، پشتو، اور ہندکو سمیت 8 زبانوں میں دستیاب۔\n📴 مکمل طور پر آف لائن — آپ کا ڈیٹا کبھی آپ کے فون سے باہر نہیں جاتا۔"
    }
  },
  {
    id: 'trial',
    keywords: { en: ['trial', 'free', 'try'], ur: ['ٹرائل', 'مفت', 'آزمائیں'] },
    chip: { en: '🎁 Free trial', ur: '🎁 مفت ٹرائل' },
    text: {
      en: "You can try Ghar Ledger completely free for 24 hours — full access, no license key needed, no credit card. Just open the app and tap \"Try free for 24 hours.\"",
      ur: "آپ گھر لیجر کو مکمل طور پر 24 گھنٹے کے لیے مفت آزما سکتے ہیں — کسی لائسنس کلید یا کریڈٹ کارڈ کی ضرورت نہیں۔ بس ایپ کھولیں اور \"24 گھنٹے مفت آزمائیں\" پر ٹیپ کریں۔"
    }
  },
  {
    id: 'license',
    keywords: { en: ['price', 'cost', 'license', 'fee', 'buy', 'purchase', 'plan', 'monthly', 'yearly', 'lifetime', 'how much'], ur: ['قیمت', 'فیس', 'لائسنس', 'خریدنا', 'پلان', 'ماہانہ', 'سالانہ', 'لائف ٹائم', 'کتنے'] },
    chip: { en: '💰 License fees', ur: '💰 لائسنس فیس' },
    text: {
      en: "Ghar Ledger has three license plans:\n\n📅 Monthly: Rs 300\n🗓 Yearly: Rs 2,500 (best for regular use)\n♾ Lifetime: Rs 5,000 (pay once, never renew)\n\nEach license works on one device only. To get your license key, contact us on " + CONTACT_PHONE + ".",
      ur: "گھر لیجر کے تین لائسنس پلان ہیں:\n\n📅 ماہانہ: 300 روپے\n🗓 سالانہ: 2,500 روپے (باقاعدہ استعمال کے لیے بہترین)\n♾ لائف ٹائم: 5,000 روپے (ایک بار ادائیگی، دوبارہ تجدید کی ضرورت نہیں)\n\nہر لائسنس صرف ایک ڈیوائس پر چلتا ہے۔ اپنی لائسنس کلید حاصل کرنے کے لیے " + CONTACT_PHONE + " پر رابطہ کریں۔"
    }
  },
  {
    id: 'renewal',
    keywords: { en: ['renew', 'renewal', 'expire', 'expiry'], ur: ['تجدید', 'ری نیو', 'ختم'] },
    chip: { en: '🔄 Renewal process', ur: '🔄 تجدید کا طریقہ' },
    text: {
      en: "How renewal works:\n\n1. Monthly (Rs 300) and Yearly (Rs 2,500) licenses need renewing when the period ends.\n2. Contact us on " + CONTACT_PHONE + " before your license expires and make the payment.\n3. We confirm your renewal and your license stays active.\n4. If payment isn't made, the license is cancelled.\n\nLifetime (Rs 5,000) licenses never need renewal. Your data always stays safe on your own device.",
      ur: "تجدید کا طریقہ:\n\n1۔ ماہانہ (300 روپے) اور سالانہ (2,500 روپے) لائسنس کی مدت ختم ہونے پر تجدید ضروری ہے۔\n2۔ لائسنس ختم ہونے سے پہلے " + CONTACT_PHONE + " پر رابطہ کریں اور ادائیگی کریں۔\n3۔ ہم آپ کی تجدید کی تصدیق کریں گے اور آپ کا لائسنس فعال رہے گا۔\n4۔ ادائیگی نہ ہونے کی صورت میں لائسنس منسوخ کر دیا جاتا ہے۔\n\nلائف ٹائم (5,000 روپے) لائسنس کی کبھی تجدید نہیں کرنی پڑتی۔ آپ کا ڈیٹا ہمیشہ آپ کے اپنے ڈیوائس پر محفوظ رہتا ہے۔"
    }
  },
  {
    id: 'contact',
    keywords: { en: ['contact', 'support', 'help', 'whatsapp', 'call'], ur: ['رابطہ', 'مدد', 'کال', 'واٹس ایپ'] },
    chip: { en: '📞 Contact us', ur: '📞 رابطہ کریں' },
    text: {
      en: "You can reach us at " + CONTACT_PHONE + " for anything about your license, a demo, or support.",
      ur: "لائسنس، ڈیمو، یا کسی بھی مدد کے لیے آپ ہم سے " + CONTACT_PHONE + " پر رابطہ کر سکتے ہیں۔"
    }
  }
];

const UI = {
  en: { placeholder: "Ask a question…", greeting: "Hi! I'm the Ghar Ledger assistant. Tap a question below, or type/speak your own — I can explain the app, pricing, or renewal, in English or Urdu.", fallback: "I don't have an exact answer for that yet. Try asking about the demo, pricing, renewal, or trial — or contact us directly at " + CONTACT_PHONE + ".", listening: "🔴 Listening…", speaking: "🔊 Speaking…", ready: "Tap a question or type below", toggleLabel: "اردو" },
  ur: { placeholder: "سوال پوچھیں…", greeting: "السلام علیکم! میں گھر لیجر اسسٹنٹ ہوں۔ نیچے سوال پر ٹیپ کریں، یا خود لکھیں/بولیں — میں ایپ، قیمت، یا تجدید کے بارے میں اردو یا انگریزی میں بتا سکتا ہوں۔", fallback: "اس کا مجھے ٹھیک جواب معلوم نہیں۔ ڈیمو، قیمت، تجدید، یا ٹرائل کے بارے میں پوچھیں — یا براہ راست " + CONTACT_PHONE + " پر رابطہ کریں۔", listening: "🔴 سن رہا ہے…", speaking: "🔊 بول رہا ہے…", ready: "نیچے سوال پر ٹیپ کریں یا لکھیں", toggleLabel: "English" }
};

const SPEECH_LANG = { en: 'en-US', ur: 'ur-PK' };

let currentLang = 'en';

function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';
  document.getElementById('langToggle').textContent = UI[lang].toggleLabel;
  document.getElementById('textInput').placeholder = UI[lang].placeholder;
  document.getElementById('statusText').textContent = UI[lang].ready;
  renderChips();
}

function renderChips(){
  const row = document.getElementById('chipRow');
  row.innerHTML = '';
  TOPICS.forEach(topic => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = topic.chip[currentLang];
    btn.onclick = () => showTopic(topic);
    row.appendChild(btn);
  });
}

function addMessage(role, text){
  const chat = document.getElementById('chatWindow');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function matchTopic(query){
  const q = query.trim().toLowerCase();
  if(!q) return null;
  for(const topic of TOPICS){
    const words = [...topic.keywords.en, ...topic.keywords.ur];
    if(words.some(w => q.includes(w.toLowerCase()))) return topic;
  }
  return null;
}

function showTopic(topic){
  const text = topic.text[currentLang];
  addMessage('agent', text);
  speak(text);
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = SPEECH_LANG[currentLang];
  utter.rate = 0.98;
  const avatar = document.getElementById('avatar');
  const status = document.getElementById('statusText');
  utter.onstart = () => { avatar.classList.add('speaking'); status.textContent = UI[currentLang].speaking; };
  utter.onend = () => { avatar.classList.remove('speaking'); status.textContent = UI[currentLang].ready; };
  utter.onerror = () => { avatar.classList.remove('speaking'); status.textContent = UI[currentLang].ready; };
  window.speechSynthesis.speak(utter);
}

function send(){
  const input = document.getElementById('textInput');
  const text = input.value.trim();
  if(!text) return;
  addMessage('user', text);
  input.value = '';
  const topic = matchTopic(text);
  if(topic){
    showTopic(topic);
  } else {
    const fallback = UI[currentLang].fallback;
    addMessage('agent', fallback);
    speak(fallback);
  }
}

document.getElementById('sendBtn').onclick = send;
document.getElementById('textInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') send();
});

document.getElementById('langToggle').onclick = () => {
  setLang(currentLang === 'en' ? 'ur' : 'en');
};

/* ---------- Mic input (ask by voice) ---------- */
(function initMic(){
  const btn = document.getElementById('micBtn');
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionCtor){
    btn.onclick = () => alert('Voice input is not supported in this browser. Try Chrome.');
    return;
  }
  const recognition = new SpeechRecognitionCtor();
  recognition.continuous = false;
  recognition.interimResults = false;
  let listening = false;

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    document.getElementById('textInput').value = transcript;
    send();
  };
  recognition.onend = () => { listening = false; btn.classList.remove('listening'); };
  recognition.onerror = () => { listening = false; btn.classList.remove('listening'); };

  btn.onclick = () => {
    if(listening){ recognition.stop(); return; }
    recognition.lang = SPEECH_LANG[currentLang];
    listening = true;
    btn.classList.add('listening');
    document.getElementById('statusText').textContent = UI[currentLang].listening;
    try{ recognition.start(); }catch(e){ listening = false; btn.classList.remove('listening'); }
  };
})();

/* ---------- Init ---------- */
setLang('en');
addMessage('agent', UI.en.greeting);
</script>
</body>
</html>
